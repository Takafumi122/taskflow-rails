services:
  - type: web
    name: taskflow-rails
    runtime: ruby
    plan: free
    region: singapore
    buildCommand: ./bin/render-build.sh
    startCommand: ./bin/render-start.sh
    healthCheckPath: /up
    envVars:
      - key: RUBY_VERSION
        value: 3.4.12
      - key: RAILS_ENV
        value: production
      - key: RAILS_MAX_THREADS
        value: 5
      - key: WEB_CONCURRENCY
        value: 0
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: BUNDLE_WITHOUT
        value: development:test
databases:
  - name: taskflow-db
    plan: free
    region: singapore
    databaseName: taskflow
    user: taskflow
